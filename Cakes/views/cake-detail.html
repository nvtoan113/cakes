<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi Tiết Sản Phẩm</title>
    <!-- Bootstrap CSS -->
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <!-- Custom Styles -->
    <link rel="stylesheet" href="/views/styles.css">
    <style>
        /* Đóng khung ảnh */
        .product-image {
            border: 2px solid #007bff;
            padding: 10px;
            border-radius: 10px;
            width: 100%;
            height: 300px; /* Chiều cao cố định */
            object-fit: cover; /* Giữ tỉ lệ ảnh và cắt nếu cần */
        }
        /* Căn thông tin bên phải ảnh */
        .product-info {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .product-info h1 {
            font-size: 2rem;
        }
        /* Khoảng cách giữa các thành phần */
        .product-info p, .product-info h3 {
            margin: 0.5rem 0;
        }
        /* Căn dưới cho nút "Add to Cart" và "Trở về trang chủ" */
        .action-buttons {
            margin-top: 2rem;
            text-align: center;
        }
        .action-buttons button {
            width: 100%;
        }
    </style>
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <a class="navbar-brand" href="#">ATN Cakes</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ml-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/">Home</a>
                </li>
            </ul>
        </div>
    </nav>

    <!-- Product Detail Section -->
    <div class="container mt-5" id="product-detail">
        <!-- Thông tin sản phẩm sẽ được chèn vào đây bởi JavaScript -->
    </div>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center py-3 mt-5">
        <p>&copy; 2024 ATN Cakes. All rights reserved.</p>
    </footer>

    <!-- Bootstrap JS and dependencies -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JavaScript để tải dữ liệu từ JSON và hiển thị -->
    <script>
        // Hàm lấy ID sản phẩm từ URL dạng /cake/1
        function getProductIdFromUrl() {
            const pathParts = window.location.pathname.split('/');  // Tách đường dẫn theo dấu '/'
            return pathParts[2];  
        }

        // Tải dữ liệu từ cake.json
        fetch('/data/cake.json')
            .then(response => {
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                return response.json();  // Chuyển đổi response thành JSON
            })
            .then(data => {
                const productId = getProductIdFromUrl(); // Lấy ID sản phẩm từ URL
                const product = data.find(p => p.id == productId); // Tìm sản phẩm theo ID
                if (product) {
                    displayProductDetails(product); // Hiển thị chi tiết sản phẩm
                } else {
                    document.getElementById('product-detail').innerHTML = '<p>Product not found</p>';
                }
            })
            .catch(error => console.error('Error loading product data:', error));

        // Hàm hiển thị chi tiết sản phẩm
        function displayProductDetails(product) {
            const productDetail = document.getElementById('product-detail');
            productDetail.innerHTML = `
                <div class="row">
                    <div class="col-md-6">
                        <img src="${product.image}" class="img-fluid product-image" alt="${product.name}">
                    </div>
                    <div class="col-md-6 product-info">
                        <div>
                            <h1 style="font-family: 'Roboto', sans-serif;">${product.name}</h1>
                            <p class="text-muted">${product.description}</p>
                            <h3 class="text-primary">$ ${product.price}</h3>
                            <p><strong>In Stock: </strong>${product.stock}</p>
                        </div>

                        <!-- Ingredients and Components Section -->
                        <div class="row mt-3">
                            <div class="col-md-6">
                                <h4>Ingredients</h4>
                                <ul>
                                    ${product.ingredients.map(ingredient => `<li>${ingredient}</li>`).join('')}
                                </ul>
                            </div>
                            <div class="col-md-6">
                                <h4>Components</h4>
                                <ul>
                                    ${product.components.map(component => `<li>${component}</li>`).join('')}
                                </ul>
                            </div>
                        </div>

                        <!-- Nút Add to Cart và Trở về trang chủ -->
                        <div class="action-buttons">
                            <button class="btn btn-success btn-lg">Add to Cart</button>
                            <button class="btn btn-primary mt-3" onclick="window.location.href='/'">Trở về trang chủ</button>
                        </div>
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
