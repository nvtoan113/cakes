<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cakes</title>
    <!-- Bootstrap CSS -->
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <!-- Custom Styles -->
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <a class="navbar-brand" href="#">ATN Cakes</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ml-auto">
                <li class="nav-item active">
                    <a class="nav-link" href="#">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">About</a>
                </li>
            </ul>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container mt-5">
        <h1 class="text-center mb-4" style="font-family: 'Roboto', sans-serif; color: #007bff;">List of Cakes</h1>
        <div id="cakes" class="row">
            <!-- Cake cards will be dynamically loaded here -->
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center py-3 mt-5">
        <p>&copy; 2024 ATN Cakes. All rights reserved.</p>
    </footer>

    <!-- Bootstrap JS and dependencies -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom JS to fetch and display cakes -->
    <script>
        // Function to load cakes from JSON file and display them
        function loadCakes() {
            fetch('/data/cake.json')
                .then(response => response.json())
                .then(data => {
                    const cakesDiv = document.getElementById('cakes');
                    data.forEach(cake => {
                        const cakeCard = `
                            <div class="col-md-4">
                                <div class="card mb-4 shadow-sm">
                                    <img src="${cake.image}" class="card-img-top img-fluid" alt="${cake.name}" style="height: 200px; object-fit: cover;">
                                    <div class="card-body">
                                        <h5 class="card-title" style="font-family: 'Roboto', sans-serif;">${cake.name}</h5>
                                        <p class="card-text" style="color: #555;">${cake.description}</p>
                                        <p class="text-muted">Price: $${cake.price}</p>
                                        <a href="/cake/${cake.id}" class="btn btn-primary">Xem chi tiết</a>
                                    </div>
                                </div>
                            </div>
                        `;
                        cakesDiv.innerHTML += cakeCard; // Append the cake card to the cakes container
                    });
                })
                .catch(error => console.error('Error loading cakes:', error));
        }

        // Call the function to load cakes when the page loads
        document.addEventListener('DOMContentLoaded', loadCakes);
    </script>
</body>
</html>
